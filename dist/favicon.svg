<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
  </defs>

  <!-- Dark Luxury Canvas with Subtle Gold Border -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#E5C158" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Architectural 'R' Monogram -->
  <g transform="translate(136, 120)">
    <!-- Vertical Pillar -->
    <rect x="16" y="20" width="32" height="232" fill="#FFFFFF" rx="4"/>
    <!-- Upper Loop -->
    <path d="M 48 20 H 140 C 196 20, 196 132, 140 132 H 48" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
    <!-- Diagonal Leg -->
    <path d="M 104 132 L 204 252" fill="none" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round"/>
  </g>

  <!-- Accent Geometry -->
  <circle cx="366" cy="144" r="16" fill="#E5C158"/>
</svg>
